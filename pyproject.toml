[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldsim-scene-master"
version = "0.1.0"
description = "Renders player-facing scenes from canon with epistemic filter."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "worldsim-schemas",
    "worldsim-prompts",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/worldsim_scene_master"]
